# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Build"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}
    name: Build
    runs-on: windows-latest
    env:
      Configuration: Release
      DeployExtension: False
      Solution: ImageOptimizer.slnx
      TestProject: test\ImageOptimizer.Test\ImageOptimizer.Test.csproj
      TestResultsDirectory: ${{ github.workspace }}\TestResults
      MinimumLineCoverage: 40
      MinimumBranchCoverage: 35
      VsixManifestPath: src\source.extension.vsixmanifest
      VsixManifestSourcePath: src\source.extension.cs

    steps:
    - uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.sln', '**/*.csproj', '**/packages.config', '**/packages.lock.json', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Increment VSIX version
      id: vsix_version
      uses: madskristensen/vsix-version-stamp@v2
      with:
        manifest-file: ${{ env.VsixManifestPath }}
        vsix-token-source-file: ${{ env.VsixManifestSourcePath }}

    - name: Restore NuGet packages
      run: msbuild ${{ env.Solution }} /v:m /t:Restore /p:Configuration=${{ env.Configuration }}

    - name: Build
      run: msbuild ${{ env.Solution }} /v:m /m /p:Configuration=${{ env.Configuration }} /p:DeployExtension=${{ env.DeployExtension }}

    - name: Run tests
      run: >
        dotnet test ${{ env.TestProject }}
        --configuration ${{ env.Configuration }}
        --no-build
        --no-restore
        --verbosity normal
        --results-directory "${{ env.TestResultsDirectory }}"
        --logger "trx;LogFileName=test-results.trx"
        --collect "Code Coverage;Format=Cobertura"

    - name: Report test results
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      with:
        name: Test Results
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Report production coverage
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem "${{ env.TestResultsDirectory }}" -Filter "*.cobertura.xml" -Recurse |
          Select-Object -First 1
        if (-not $coverageFile) {
          throw "Cobertura coverage report was not produced."
        }

        [xml]$coverage = Get-Content $coverageFile.FullName
        $productionCoverage = @($coverage.coverage.packages.package) |
          Where-Object { $_.name -eq "ImageOptimizer" } |
          Select-Object -First 1
        if (-not $productionCoverage) {
          throw "The ImageOptimizer production assembly was not found in the coverage report."
        }

        $lineCoverage = [double]$productionCoverage.'line-rate' * 100
        $branchCoverage = [double]$productionCoverage.'branch-rate' * 100
        @"
        ## Production code coverage

        | Metric | Coverage | Required |
        | --- | ---: | ---: |
        | Lines | $($lineCoverage.ToString('F2'))% | ${{ env.MinimumLineCoverage }}% |
        | Branches | $($branchCoverage.ToString('F2'))% | ${{ env.MinimumBranchCoverage }}% |
        "@ >> $env:GITHUB_STEP_SUMMARY

        if ($lineCoverage -lt [double]"${{ env.MinimumLineCoverage }}") {
          throw "Production line coverage $($lineCoverage.ToString('F2'))% is below the required ${{ env.MinimumLineCoverage }}%."
        }
        if ($branchCoverage -lt [double]"${{ env.MinimumBranchCoverage }}") {
          throw "Production branch coverage $($branchCoverage.ToString('F2'))% is below the required ${{ env.MinimumBranchCoverage }}%."
        }

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: coverage-report
        path: TestResults/**/*.cobertura.xml
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}.vsix
        path: src\bin\${{ env.Configuration }}\net48\ImageOptimizer.vsix
        if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}.vsix

      - name: Upload to Open VSIX
        uses: madskristensen/publish-vsixgallery@v1
        with:
          vsix-file: ${{ github.event.repository.name }}.vsix

      - name: Publish extension to Marketplace
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: '${{ github.event.repository.name }}.vsix'
          publish-manifest-file: 'vs-publish.json'
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}

      - name: Tag and release
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        id: tag_release
        uses: softprops/action-gh-release@v3
        with:
          body: release ${{ needs.build.outputs.version }}
          generate_release_notes: true
          tag_name: ${{ needs.build.outputs.version }}
          files: |
            **/*.vsix
